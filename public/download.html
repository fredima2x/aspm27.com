<DOCTYPE! html>
    <html>
        <head></head>
        <body>
            <button class="download-button">
                <p class="download-label">Download</p>
                <p class="download-os-label">Loading...</p>
                <p class="download-version-label">Loading...</p>
            </button>
            <script>


            const supportedOS = [
              "Windows", "macOS", "Linux"
            ]


            let downloadButton = document.querySelector('.download-button');
            let osLabel = downloadButton.querySelector('.download-os-label');
            let downloadLabel = downloadButton.querySelector('.download-label');


            function getOS() {
              const ua = navigator.userAgent;
              if (ua.includes("Windows")) return "Windows";
              if (ua.includes("Android")) return "Android";
              if (ua.includes("iPhone") || ua.includes("iPad")) return "iOS";
              if (ua.includes("Mac")) return "macOS";
              if (ua.includes("Linux")) return "Linux";
              return "unknown";
            }

            async function getLatestRelease() {
              const response = await fetch(
                "https://api.github.com/repos/user/repo/releases/latest"
              );
              return await response.json();
            }

            async function getAssetURL(release, os) {
              let suffix = "";
              if (os === "Windows") { suffix = ".exe" }
              if (os === "macOS") { suffix = ".dmg" }
              if (os === "Linux") { suffix = ".AppImage"}

              const asset = release.assets.find(asset => {
                const name = asset.name.toLowerCase();
                return (
                  name.includes("aspm27") &&
                  name.includes(suffix)
                );
              });

              return asset.browser_download_url;
            }

            async function init() {
              const release = getLatestRelease();

            }

            await init();

            downloadButton.addEventListener('click', () => {
              downloadLabel.textContent = 'Downloading...';
              osLabel.textContent = '';
            });

            </script>
        </body>
    </html>
</DOCTYPE>
