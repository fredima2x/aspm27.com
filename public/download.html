<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="./styles/index/general.css">
	<link rel="stylesheet" href="./styles/index/header.css">
	<link rel="stylesheet" href="./styles/index/fonts.css">

	<style>
    	.headline {
    		color: var(--white);
            margin-top: 0px;
    	}
    	body {
            color: var(--black);
            justify-items: center;
            padding-top: 100px;
            background-color: black;
            background-image: linear-gradient(to right,rgba(0, 219, 124, 0.50),black);
    	}
		.download-version-label {
			font-size: 0.8rem;
			display: flex;
			justify-content: center;
			align-items: center;
			color: rgba(255, 255, 255, 0.5);
			margin-top: 5px;
		}
		.download-page {
		    min-width: 360px;
			justify-content: center;
			align-items: center;
			box-shadow: 0px 0px 15px rgb(15, 15, 15);
			background-color: rgb(15, 15, 15);
			padding-top: 30px !important;
			padding: 40px;
			border-radius: 10px;
		}
		.download-button {
			background-color: var(--black);
			color: var(--white);
			border: 4px solid var(--theme);
            border-radius: 10px;
            transition: 0.3s;
            min-width: 100%;
		}
		.download-button:hover {
		    background-color: var(--theme);
			color: var(--black);
		}
		.alt-download-menu {
			background-color: var(--black);
			color: var(--white);
			padding: 10px;
			cursor: pointer;
			transition: 0.3s;
		}
		.alt-download-menu:hover {
			transform: scale(1.05);
		}

		header {
		    box-shadow: 0 2px 2px var(--theme);
		}

		@media (max-width: 768px) {
			body {
				padding-top: 40% !important;
			}
		}
	</style>
</head>

<body class="google-sans-normal">
	<header class="normal">
		<div class="content-centered-row">
			<img src="" alt="LOGO">
		</div>

		<nav class="content-centered-row">
			<button class="js-button1">The aspm project</button>
			<button class="js-button2">About us</button>
			<button class="js-button3">Download</button>
		</nav>

		<div class="content-centered-row">
			<p>Contact us:</p>
			<a href="https://github.com/fredima2x/aspm27">
				<img src="./assets/GitHub_Lockup_Black.svg" alt="GitHub logo">
			</a>
			<a href="https://facebook.com">
				<img src="./assets/Facebook_Logo_Primary.png" alt="FaceBook logo">
			</a>
		</div>
	</header>

	<div class="download-page">
		<h2 class="headline">Download aspm27</h2>
	    <div class="download-box">
    		<button class="download-button">
    			<div class="download-button-text">
    				<p class="download-label">Download</p>
    				<p class="download-os-label">Loading...</p>
    			</div>
    		</button>
    		<p class="download-version-label">Loading...</p>
		</div>
		<details>
			<summary class="alt-download-menu">Show more</summary>
			<div class="alt-download-menu-content">
    			<ul class="alt-download-container">
    				Loading...
    			</ul>
			</div>
		</details>

	</div>

	<script type="module" src="scripts/download.js"></script>
	<script type="module" src="scripts/header.js"></script>
</body>

</html>
