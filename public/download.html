<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="./styles/index/general.css">
	<link rel="stylesheet" href="./styles/index/header.css">
	<link rel="stylesheet" href="./styles/index/fonts.css">
	<link rel="stylesheet" href="./styles/index/animations.css">
	<style>
		.headline {
			color: var(--white);
			margin-top: 0px;
		}

		body {
			color: var(--black);
			justify-items: center;
			padding-top: 100px;
			background-color: black;
			background-image: linear-gradient(to right, rgba(0, 219, 124, 0.50), black);
		}

		a {
			color: var(--theme);
			text-decoration: none;
		}

		select {
			width: 100%;
			background-color: var(--black);
			color: var(--white);
			padding: 10px;
			cursor: pointer;
			transition: 0.3s;
			border-radius: 10px;
			border: 4px solid var(--theme);
		}

		select:hover {
			transform: scale(1.05);
		}

		select:focus {
			outline: none;
		}

		.download-version-label, .download-size-label {
			font-size: 0.8rem;
			display: flex;
			justify-content: center;
			align-items: center;
			color: rgba(255, 255, 255, 0.5) !important;
			margin-top: 5px;
			margin-inline: 5px;
		}

		.download-page {
			min-width: 360px;
			justify-content: center;
			align-items: center;
			box-shadow: 0px 0px 15px rgb(15, 15, 15);
			background-color: rgb(15, 15, 15);
			padding-top: 30px !important;
			padding: 40px;
			border-radius: 10px;
			animation: fadeIn 1s ease-in-out forwards;
		}
		@keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
		}

		.download-button {
		    background-color: black;
			background-image: linear-gradient(to right, rgb(15, 15, 15), rgba(0, 219, 124, 0.25));
			color: var(--white);
			border: 4px solid var(--theme);
			border-radius: 10px;
			transition: 0.3s;
			min-width: 100%;
		}

		.download-dialog {
			margin: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: row;
			padding: 0;
		}


		.download-button:hover {
			transform: scale(1.05);
		}

		.download-icon {
			height: 40px;
			margin: 20px;
		}

		.download-label {
			margin-top: 0;
			margin-bottom: 6px;
		}
		.download-os-label {
			margin-top: 6px;
		}
		.alt-download-container {
			background-image: linear-gradient(to right, rgb(15, 15, 15), rgba(0, 219, 124, 0.25));
		}

		@media (max-width: 768px) {
			body {
				padding-top: 40% !important;
			}
		}

	</style>
</head>

<body class="google-sans-normal">
	<header class="normal">
		<div class="content-centered-row">
			<img src="" alt="LOGO">
		</div>

		<nav class="content-centered-row">
			<button class="js-button1">The aspm project</button>
			<button class="js-button2">About us</button>
			<button class="js-button3">Download</button>
		</nav>

		<div class="content-centered-row">
			<p>Contact us:</p>
			<a href="https://github.com/fredima2x/aspm27">
				<img src="./assets/GitHub_Lockup_Black.svg" alt="GitHub logo">
			</a>
			<a href="https://facebook.com">
				<img src="./assets/Facebook_Logo_Primary.png" alt="FaceBook logo">
			</a>
		</div>
	</header>

	<div class="download-page">
		<h2 class="headline">Download aspm27</h2>
		<div class="download-box">
			<button class="download-button">
			    <img class="download-icon" src="./assets/loading.svg" alt="Windows logo">
				<div class="download-button-text">
					<p class="download-label">Download</p>
					<p class="download-os-label">Loading...</p>
				</div>
			</button>
			<div class="download-dialog">
				<p class="download-version-label">Loading...</p>
				<p class="download-size-label">Loading...</p>
			</div>
		</div>
		<select class="alt-download-container">
			<option value="">Other versions</option>
		</select>

	</div>

	<script type="module" src="scripts/download.js"></script>
	<script type="module" src="scripts/header.js"></script>
</body>

</html>
