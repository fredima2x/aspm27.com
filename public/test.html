<!DOCTYPE html>
<html>
<head>
    <style>
    .fadeIn {
        display: inline-block;
        opacity: 0;
        animation: fadeIn 2s ease-in-out forwards;
    }

    .delay_1 {
        animation-delay: 1s;
    }

    .delay_2 {
        animation-delay: 2s;
    }

    .delay_3 {
        animation-delay: 3s;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    </style>
</head>

<body>

    <h1 class="fadeIn delay_1">Welcome!</h1><br/>
    <h1 class="fadeIn delay_2">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</h1><br/>
    <h1 class="fadeIn delay_3">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</h1><br/>

</body>
</html>
